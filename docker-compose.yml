services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xether-postgres
    environment:
      POSTGRES_USER: xether
      POSTGRES_PASSWORD: xether_password
      POSTGRES_DB: xether_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xether"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xether-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: xether-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xether-network

  # NATS Message Bus
  nats:
    image: nats:2.10-alpine
    container_name: xether-nats
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    command: ["-js", "-m", "8222"]  # Enable JetStream and monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xether-network

  # Backend API (for local development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xether-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://xether:xether_password@postgres:5432/xether_db
      - REDIS_URL=redis://redis:6379/0
      - NATS_SERVERS=nats://nats:4222
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - xether-network

networks:
  xether-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
