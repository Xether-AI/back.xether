stages:
  - lint
  - test
  - build

variables:
  PYTHON_IMAGE: python:3.11-slim
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

# Cache patterns
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install .[dev,test]

lint:
  stage: lint
  image: $PYTHON_IMAGE
  script:
    - ruff check .
    - black --check .
    - mypy .
  only:
    - merge_requests
    - main

test:
  stage: test
  image: $PYTHON_IMAGE
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: xether_db
    POSTGRES_USER: xether
    POSTGRES_PASSWORD: xether_password
    DATABASE_URL: "postgresql+asyncpg://xether:xether_password@postgres:5432/xether_db"
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pytest --cov=app tests/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - main

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE_NAME .
    - docker push $DOCKER_IMAGE_NAME
  only:
    - main
  when: manual # Keeping it manual for safety unless specific env vars are set
